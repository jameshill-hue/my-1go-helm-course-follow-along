apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "test-hook.fullname" . }}-test-connection"
  labels:
    {{- include "test-hook.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "10"
spec:
  containers:
    - name: alpine
      image: alpine:3.20
      command: ['sh', '-c', '/tests/run.sh']
      volumeMounts:  # Mount the test scripts directory
        - mountPath: /tests # Mount path inside the container
          name: tests # Name of the volume    
  restartPolicy: Never
  volumes:
    - name: tests # Name of the volume
      configMap:
        name: {{ include "test-hook.fullname" . }}-test-files # Name of the config map
        defaultMode: 0744 # Set to executable
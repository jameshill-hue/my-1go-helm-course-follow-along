{{- range $key, $svc := (.Values.services | default dict) }}
{{ include "templating-deep-dive.validators.service" $svc }}
---
# the value of the dot .: {{ . }} is the context of the template
apiVersion: v1
kind: Service
metadata: 
  name: {{ include "templating-deep-dive.fullname" $ | nindent 4 }}-{{ $key }}
  labels:
    {{- include "templating-deep-dive.selectorLabels" $ | nindent 4 }}
spec:
    type: {{ $.type }}
    selector:
        {{- include "templating-deep-dive.selectorLabels" $ | nindent 4 }}
    ports:
        - protocol: TCP
          port: {{ .port }}
          targetPort: {{ $.Values.containerPorts.http }}
{{- end }}